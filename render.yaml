# Render — despliegue gratuito de Circular Campus
# Docs: https://render.com/docs/yaml-spec
services:
  - type: web
    name: campus-circular
    runtime: python
    # La app puede usar PostgreSQL externo gratuito mediante DATABASE_URL.
    plan: free
    healthCheckPath: /healthz
    buildCommand: pip install -r requirements.txt
    # Un worker con 8 hilos: menos RAM y límites de seguridad exactos, porque
    # el contador de peticiones vive en memoria del proceso.
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 60 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: APP_ENV
        value: production
      # Pega aquí la URL PostgreSQL de tu proveedor (marca sync: false).
      - key: DATABASE_URL
        sync: false
      - key: SEED_DEMO
        value: "1"
      # Sustituir por un correo real antes de usar datos personales reales.
      - key: CONTACT_EMAIL
        value: privacidad@circular-campus.example
      # Sustituir por la identificación real del responsable antes de producción.
      - key: CONTROLLER_NAME
        value: Equipo Circular Campus (proyecto académico independiente)
      - key: LEGAL_VERSION
        value: 2026-11-20
      - key: LEGAL_UPDATED
        value: 2026-11-20
      # Dominios de correo institucional aceptados para la insignia informativa
      # (separados por comas). Si se omite, se usa la lista interna del código.
      - key: UNIVERSITY_DOMAINS
        sync: false
      # CORS restringido al dominio propio. Si añades otro (por ejemplo, un
      # dominio personalizado), sepáralos por comas.
      - key: CORS_ORIGINS
        value: https://campus-circular.onrender.com
      # Límites de peticiones en memoria y umbral de retirada por reportes.
      - key: RATE_LIMIT_ENABLED
        value: "1"
      - key: REPORT_HIDE_THRESHOLD
        value: "3"
      # Exposición: cuentas temporales de 24 h y techo global más alto porque
      # todos los asistentes comparten la IP del wifi del congreso.
      - key: DEMO_TTL_HOURS
        value: "24"
      - key: API_RATE_LIMIT
        value: "900"
      # Render está detrás de un proxy: 1 salto de confianza para X-Forwarded-*.
      - key: TRUST_PROXY
        value: "1"
      # La app no debe poder embeberse en webs de terceros en producción.
      - key: ALLOW_EMBED
        value: "0"
