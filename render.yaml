# Render — despliegue gratuito de Campus Circular
# Docs: https://render.com/docs/yaml-spec
services:
  - type: web
    name: campus-circular
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE
        value: /tmp/campus_circular.db
