# Render — despliegue gratuito de Circular Campus
# Docs: https://render.com/docs/yaml-spec
services:
  - type: web
    name: campus-circular
    runtime: python
    # La app puede usar PostgreSQL externo gratuito mediante DATABASE_URL.
    plan: free
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements.txt
    startCommand: python3 app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: APP_ENV
        value: production
      # Pega aquí la URL PostgreSQL de tu proveedor (marca sync: false).
      - key: DATABASE_URL
        sync: false
      - key: SEED_DEMO
        value: "1"
      # Sustituir por un correo real antes de usar datos personales reales.
      - key: CONTACT_EMAIL
        value: privacidad@circular-campus.example
      # Sustituir por la identificación real del responsable antes de producción.
      - key: CONTROLLER_NAME
        value: Equipo Circular Campus (proyecto académico independiente)
      - key: LEGAL_VERSION
        value: 2026-11-20
      - key: LEGAL_UPDATED
        value: 2026-11-20
      # Dominios de correo institucional aceptados para la insignia informativa
      # (separados por comas). Si se omite, se usa la lista interna del código.
      - key: UNIVERSITY_DOMAINS
        sync: false
